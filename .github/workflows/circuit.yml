name: Circuit verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fabrication:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Verify native JLCPCB import
        run: |
          rm imports/ANNA_B112_00B.tsx
          npx tsci import C2931350 --jlcpcb --use-exact-footprint
          diff -u <(git show HEAD:imports/ANNA_B112_00B.tsx) imports/ANNA_B112_00B.tsx
      - run: npm run typecheck
      - run: npx tsci check netlist
      - run: npx tsci check schematic-placement
      - run: npx tsci check placement
      - run: npx tsci build
      - run: npm run check:power
      - run: npm run check:fabrication
      - run: npx tsci check shorts dist/index/circuit.json
      - name: Check exported Gerber copper
        run: |
          python -m pip install gerbonara shapely
          npx tsci export dist/index/circuit.json -f gerbers -o "$RUNNER_TEMP/fab.zip"
          python -m zipfile -e "$RUNNER_TEMP/fab.zip" "$RUNNER_TEMP/fab"
          python scripts/check-gerbers.py "$RUNNER_TEMP/fab" dist/index/circuit.json
      - name: Preserve diagnostic circuit JSON
        if: always()
        run: |
          if [ -f dist/index/circuit.json ]; then
            node -e 'const c=require("./dist/index/circuit.json"); const u=c.find(e=>e.type==="source_component"&&e.name==="U1"); const ports=c.filter(e=>e.type==="source_port"&&e.source_component_id===u.source_component_id); console.log(JSON.stringify({errors:c.filter(e=>e.type.endsWith("_error")),radio:u,ports,rf:c.filter(e=>e.type==="pcb_trace"&&["pcb_trace_0","pcb_trace_1"].includes(e.pcb_trace_id))},null,2))'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: circuit-diagnostics
          path: |
            dist/index/circuit.json
            imports/ANNA_B112_00B.tsx
          if-no-files-found: ignore
